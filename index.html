<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="sidebar">
      <div id="sidebar-row">
        <div>
          <img src="/img/odin-lined.png" alt="Odin" />
          <h1>ODIN</h1>
        </div>
      </div>
      <div class="sidebar-placeholder"></div>
      <div class="sidebar-placeholder"></div>
    </div>
    <div id="content-area">
      <div id="introduction">
        <div>
          This is not a real online service! you know you need something like this in your life to
          help you realize your deepest dreams. <br />Sign up <i>now</i> to get started <br />
          <br />
          You <i>know</i> you want to.
        </div>
      </div>
      <form id="signup-form" action=".">
        <div id="form">
          <h2>Let's do this!</h2>
          <div id="form-items">
            <div class="form-row">
              <div>
                <label for="firstname">FIRST NAME</label>
                <input type="text" name="firstname" id="firstname" />
              </div>
              <div>
                <label for="lastname">LAST NAME</label>
                <input type="text" name="lastname" id="lastname" />
              </div>
            </div>
            <div class="form-row">
              <div>
                <label for="mail">EMAIL</label>
                <input type="email" name="mail" id="mail" />
              </div>
              <div>
                <label for="telefon">PHONE NUMBER</label>
                <input type="tel" name="telefon" id="telefon" />
              </div>
            </div>
            <div class="form-row">
              <div>
                <label for="password">PASSWORD</label>
                <input type="password" name="password" id="password" required />
              </div>
              <div>
                <label for="confirm-password">CONFIRM PASSWORD</label>
                <input type="password" name="confirm-password" id="confirm-password" required />
              </div>
            </div>
          </div>
        </div>
      </form>
      <div id="account">
        <div><button type="submit" form="signup-form">Create Account</button></div>
      </div>
    </div>
  </body>
</html>
